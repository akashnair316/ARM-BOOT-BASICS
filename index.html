<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embedded ARM Setup Guide</title>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Ubuntu', sans-serif;
      background: linear-gradient(145deg, #0a0a0a, #1a1a1a);
      color: #eee;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      padding: 1.5rem;
      background: #111;
      font-size: 1.8rem;
      font-weight: bold;
      color: #00ff99;
    }
    .section {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
      background: #181818;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }
    h2 {
      margin-top: 0;
      color: #00ff99;
    }
    pre {
      background: #0d0d0d;
      color: #0ff0ff;
      padding: 1rem;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.95rem;
    }
    button.copy-btn {
      background: #00ff99;
      color: #000;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      float: right;
      font-size: 0.8rem;
    }
    details {
      margin-bottom: 1rem;
    }
    summary {
      cursor: pointer;
      font-weight: bold;
      padding: 0.5rem 0;
    }
  </style>
</head>
<body>

<header>⚡ Embedded ARM Setup Guide</header>

<div class="section">
  <details open>
    <summary>📦 Installation Packages</summary>
    <button class="copy-btn" onclick="copyText('install')">Copy</button>
<pre id="install">sudo apt-get install gdb-multiarch
pip3 install pygments --break-system-packages
wget -P ~ https://git.io/.gdbinit</pre>
  </details>

  <details>
    <summary>🚀 Execution Steps</summary>
    <button class="copy-btn" onclick="copyText('exec')">Copy</button>
<pre id="exec">cd $(your_path)/ARM-BOOT-BASICS/FreeRTOS-ARM-BOOT
make
make qemu
# Open another terminal
make gdb</pre>
  </details>
</div>

<script>
function copyText(id) {
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text).then(() => {
    alert("Copied to clipboard!");
  });
}
</script>

</body>
</html>
